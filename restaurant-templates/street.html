<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="robots" content="noindex,nofollow">
<title>AQX Food — Street Restaurant Template</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,a{font:inherit}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1180px)/2));position:sticky;top:0;z-index:5}.brand{font-weight:900;letter-spacing:.4px}.aqx-brand{font-size:12px;color:var(--muted)}.cart-open{border:0;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:999px;cursor:pointer}.cart-open b{background:var(--accent);color:#fff;padding:2px 7px;border-radius:20px;margin-inline-start:5px}
.hero{position:relative;max-width:1180px;margin:0 auto 24px;background-size:cover;background-position:center;display:flex;align-items:center;padding:38px 6%;overflow:hidden;color:#fff}.hero:after{content:"";position:absolute;inset:0}.hero-content{position:relative;z-index:1;max-width:640px}.identity{display:flex;align-items:center;gap:16px;margin-bottom:18px}.logo{width:64px;height:64px;display:grid;place-items:center;font-size:28px;font-weight:900;overflow:hidden;flex-shrink:0}.logo img{width:100%;height:100%;object-fit:cover}.hero h1{font-size:clamp(30px,5vw,54px);margin:0 0 10px}.hero p{line-height:1.8;color:#f2eee7;margin:6px 0}.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:#f5eee3}.content{max-width:1180px;margin:auto;padding:0 20px 80px}.aqx-ad{margin:18px auto 28px;padding:14px 18px;border:1px dashed var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}.aqx-ad strong{color:var(--ink)}.category-nav{display:flex;gap:9px;overflow:auto;padding:10px 0 22px;position:sticky;top:68px;background:var(--paper);z-index:3}.category-nav a{white-space:nowrap;padding:10px 16px;text-decoration:none;color:var(--ink);font-size:13px}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;padding:16px 0;margin:10px 0 20px}.eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:1px}.section-heading h2{margin:5px 0;font-size:28px}.section-heading p{color:var(--muted);margin:0;font-size:13px}.count{font-size:12px;color:var(--muted);white-space:nowrap}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.product{display:flex;gap:14px;padding:12px;min-width:0}.product-photo{width:132px;min-width:132px;min-height:132px;display:grid;place-items:center;color:var(--accent);font-size:42px;overflow:hidden}.product-photo img{width:100%;height:100%;min-height:132px;object-fit:cover}.product-info{flex:1;min-width:0;display:flex;flex-direction:column}.product-info h3{font-size:18px;margin:4px 0 7px}.product-info p{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 14px}.product-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}.product-bottom strong{font-size:15px;white-space:nowrap}.add{border:0;color:white;padding:9px 12px;cursor:pointer;font-size:12px;white-space:nowrap}.add span{font-size:16px;margin-inline-start:4px}.cart-panel{position:fixed;z-index:10;inset:0  auto 0 0;width:min(390px,92vw);background:var(--surface);box-shadow:0 0 0 100vmax #0007;transform:translateX(-110%);transition:transform .25s;padding:22px;display:flex;flex-direction:column}.cart-panel.open{transform:translateX(0)}.cart-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px}.cart-head button{border:0;background:none;font-size:24px;cursor:pointer;color:var(--ink)}.cart-items{padding:12px 0;overflow:auto}.cart-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.cart-empty{color:var(--muted);text-align:center;padding:32px 0}.cart-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}.cart-total{display:flex;justify-content:space-between;font-weight:900;margin-bottom:12px}.checkout-note{font-size:11px;color:var(--muted);line-height:1.7}.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;text-align:center;padding:50px 20px;color:var(--muted)}#status{max-width:800px;margin:50px auto;text-align:center;padding:20px;color:var(--muted)}footer{padding:26px 20px;text-align:center;color:var(--muted);font-size:11px}.white-label .aqx-brand,.white-label .aqx-ad{display:none!important}
@media(max-width:700px){.topbar{height:60px;padding:0 16px}.hero{margin:0 0 18px;min-height:290px;padding:28px 22px}.logo{width:54px;height:54px}.content{padding:0 14px 70px}.category-nav{top:60px}.products{grid-template-columns:1fr;gap:12px}.product{gap:12px}.product-photo{width:112px;min-width:112px;min-height:118px}.product-photo img{min-height:118px}.section-heading h2{font-size:24px}.aqx-ad{align-items:flex-start;flex-direction:column}.product-info h3{font-size:16px}}
@media(min-width:701px) and (max-width:980px){.products{grid-template-columns:1fr}}


:root{--ink:#202020;--muted:#686868;--accent:#ef542e;--accent2:#ffd24a;--paper:#fff8ed;--surface:#fff;--line:#f0ddc8;--hero:#24201d}
body{background:var(--paper);color:var(--ink);font-family:Arial,Tahoma,sans-serif}
.topbar{background:#fff;border-bottom:3px solid var(--ink)}
.hero{background-color:#24201d;border-radius:0 0 36px 0;min-height:330px}
.hero:after{background:linear-gradient(90deg,rgba(0,0,0,.76),rgba(0,0,0,.08))}
.logo{border-radius:14px;background:var(--accent2);color:#222;transform:rotate(-4deg)}
h1,h2,h3{font-weight:900}
.product{background:var(--surface);border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink)}
.product-photo{background:linear-gradient(135deg,#ffe3a1,#fff2d5);border-radius:12px}
.add{background:var(--accent);color:white;border:2px solid var(--ink);border-radius:10px;font-weight:900}
.category-nav a{border:2px solid var(--ink);border-radius:10px;font-weight:800}
.category-nav a.active{background:var(--accent2);color:#222}
.section-heading{border-bottom:3px solid var(--ink)}
</style>
</head>
<body>
<header class="topbar"><div class="brand">مطعمك <span class="aqx-brand">بواسطة AQX Food</span></div><button class="cart-open" id="cart-open" type="button">السلة <b id="cart-count">0</b></button></header>
<section class="hero" id="hero" hidden><div class="hero-content"><div class="identity"><div class="logo" id="store-logo">م</div><div><span class="eyebrow">أهلاً وسهلاً</span><h1 id="store-name">المطعم</h1></div></div><p id="store-description"></p><div class="meta"><span id="store-city"></span><span id="store-address"></span><span id="minimum"></span><span id="prep"></span></div></div></section>
<div id="status" role="status" aria-live="polite">جاري تجهيز صفحة المطعم...</div>
<main class="content" id="content" hidden>
<div class="aqx-ad"><span><strong>مساحة إعلانية من AQX</strong> — عروض وخدمات مفيدة لزوار المطعم</span><span>إعلان</span></div>
<nav class="category-nav" id="categories" aria-label="أقسام المنيو"></nav>
<div id="menu"></div>
</main>
<aside class="cart-panel" id="cart-panel" aria-label="سلة المشتريات"><div class="cart-head"><strong>سلة طلبك</strong><button id="cart-close" type="button" aria-label="إغلاق">×</button></div><div class="cart-items" id="cart-items"></div><div class="cart-footer"><div class="cart-total"><span>الإجمالي المبدئي</span><span id="cart-total">0</span></div><p class="checkout-note">هذه معاينة لقالب واجهة المطعم. سيتم تفعيل إرسال الطلب والدفع عند ربط مسار الطلبات المعتمد.</p></div></aside>
<footer class="aqx-brand">مدعوم بواسطة AQX Food</footer>
<script>
const API = "https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-food-api";
const $ = (s) => document.querySelector(s);
const money = (n,c) => new Intl.NumberFormat("ar-EG",{style:"currency",currency:c||"EGP",maximumFractionDigits:2}).format(Number(n)||0);
const safe = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugFromLocation = () => {
  const q = new URLSearchParams(location.search).get("store");
  if (q) return q.trim();
  const parts = location.pathname.split("/").filter(Boolean);
  const r = parts.indexOf("r");
  if (r >= 0 && parts[r+1]) return decodeURIComponent(parts[r+1]);
  const host = location.hostname.split(".");
  if (host.length > 3 && host[1] === "food") return host[0];
  return "";
};
let storeData = null, cart = [];
function setStatus(message){ $("#status").textContent = message; }
function productImage(p){
  const url = p?.metadata?.image_url || p?.metadata?.image || p?.image_url || "";
  return /^https?:\/\//i.test(url) ? url : "";
}
function render(data){
  storeData = data;
  const store = data.store || {};
  const whiteLabel = store.white_label_enabled === true; // entitlement must be supplied by the trusted backend after payment verification.
  document.title = (store.name || "المطعم") + " | AQX Food";
  $("#store-name").textContent = store.name || "مطعم جديد";
  $("#store-description").textContent = store.description || "أهلاً بيك! اختار من المنيو واستمتع بطلبك.";
  $("#store-city").textContent = [store.city,store.region].filter(Boolean).join(" • ");
  $("#store-address").textContent = store.address || "";
  $("#store-phone").textContent = store.phone || "";
  $("#store-logo").textContent = (store.name || "م").trim().slice(0,1);
  const cover = /^https?:\/\//i.test(store.cover_path || "") ? store.cover_path : "";
  if (cover) $("#hero").style.backgroundImage = "linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.12)),url('" + cover.replace(/'/g,"%27") + "')";
  const logo = /^https?:\/\//i.test(store.logo_path || "") ? store.logo_path : "";
  if (logo) $("#store-logo").innerHTML = '<img src="' + safe(logo) + '" alt="">';
  document.body.classList.toggle("white-label",whiteLabel);
  $(".aqx-brand").hidden = whiteLabel;
  $(".aqx-ad").hidden = whiteLabel;
  $("#minimum").textContent = Number(store.minimum_order_amount)>0 ? "الحد الأدنى للطلب: "+money(store.minimum_order_amount,store.currency) : "نستقبل طلباتك الآن";
  $("#prep").textContent = store.average_preparation_minutes ? "وقت التحضير التقريبي "+store.average_preparation_minutes+" دقيقة" : "";
  const categories = data.categories || [];
  $("#categories").innerHTML = categories.map((c,i)=>'<a href="#cat-'+safe(c.id)+'" class="'+(i===0?"active":"")+'">'+safe(c.name)+'</a>').join("");
  $("#menu").innerHTML = categories.map(c => {
    const products = c.products || [];
    return '<section class="category" id="cat-'+safe(c.id)+'"><div class="section-heading"><div><span class="eyebrow">من المنيو</span><h2>'+safe(c.name)+'</h2><p>'+safe(c.description||"")+'</p></div><span class="count">'+products.length+' أصناف</span></div><div class="products">'+products.map(p=>{
      const img=productImage(p);
      return '<article class="product"><div class="product-photo">'+(img?'<img loading="lazy" src="'+safe(img)+'" alt="'+safe(p.name)+'">':'<span>✦</span>')+'</div><div class="product-info"><h3>'+safe(p.name)+'</h3><p>'+safe(p.description||"")+'</p><div class="product-bottom"><strong>'+money(p.price, p.currency||store.currency)+'</strong><button type="button" class="add" data-id="'+safe(p.id)+'">أضف للسلة <span>＋</span></button></div></div></article>';
    }).join("")+'</div></section>';
  }).join("");
  if (!categories.length) $("#menu").innerHTML = '<div class="empty"><strong>المنيو قيد التجهيز</strong><p>سيتم عرض الأصناف هنا بمجرد نشرها من المطعم.</p></div>';
  $("#hero").hidden = false;
  $("#content").hidden = false;
  setStatus("");
  $("#menu").querySelectorAll(".add").forEach(btn=>btn.addEventListener("click",()=>addProduct(btn.dataset.id)));
  updateCart();
}
function addProduct(id){
  const product=(storeData?.categories||[]).flatMap(c=>c.products||[]).find(p=>String(p.id)===String(id));
  if(!product)return;
  const found=cart.find(x=>x.id===id);
  if(found)found.qty++; else cart.push({id,name:product.name,price:Number(product.price)||0,currency:product.currency||storeData.store?.currency||"EGP",qty:1});
  updateCart();
}
function updateCart(){
  const count=cart.reduce((n,x)=>n+x.qty,0), total=cart.reduce((n,x)=>n+x.qty*x.price,0);
  $("#cart-count").textContent=count;
  $("#cart-total").textContent=money(total,storeData?.store?.currency||"EGP");
  $("#cart-items").innerHTML=cart.length?cart.map(x=>'<div class="cart-line"><span>'+safe(x.name)+' × '+x.qty+'</span><b>'+money(x.price*x.qty,x.currency)+'</b></div>').join(""):'<p class="cart-empty">السلة لسه فاضية.</p>';
}
$("#cart-open").addEventListener("click",()=>$("#cart-panel").classList.toggle("open"));
$("#cart-close").addEventListener("click",()=>$("#cart-panel").classList.remove("open"));
$("#cart-items").addEventListener("click",()=>{});
(async()=>{
  const slug=slugFromLocation();
  if(!slug){setStatus("افتح رابط المطعم أو أضف ?store=اسم-المطعم إلى الرابط.");return;}
  try{
    setStatus("بنحمّل صفحة المطعم والمنيو...");
    const response=await fetch(API+"/public/storefront/"+encodeURIComponent(slug),{headers:{Accept:"application/json"}});
    const result=await response.json();
    if(!response.ok||!result.ok||!result.storefront)throw new Error(result.error||"storefront_unavailable");
    render(result.storefront);
  }catch(error){
    console.error(error);
    setStatus("تعذر تحميل صفحة المطعم حاليًا. تأكد من نشر المطعم وإعداد ربط النطاق.");
  }
})();</script>
</body></html>
